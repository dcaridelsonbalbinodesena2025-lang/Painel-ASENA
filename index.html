<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K.C⚽️M - Analisador Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0b0f19;
            --bg-card: #151c2c;
            --bg-hover: #1e293b;
            --border: #2e3a52;
            --accent-green: #00ff87;
            --accent-blue: #00d2ff;
            --accent-purple: #9d4edd;
            --accent-pink: #f72585;
            --accent-yellow: #ffb703;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
        body { background: radial-gradient(circle at top right, #131b2e, #0b0f19); color: var(--text-main); padding: 24px; min-height: 100vh; }
        .header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; margin-bottom: 24px; background: rgba(21, 28, 44, 0.8); backdrop-filter: blur(10px); padding: 20px 28px; border-radius: 16px; border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }
        .title-container h1 { font-size: 1.6rem; font-weight: 800; background: linear-gradient(90deg, var(--accent-green), var(--accent-blue)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .title-container p { color: var(--text-muted); font-size: 0.85rem; margin-top: 4px; }
        .stats-summary { display: flex; gap: 16px; }
        .stat-card { background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border); padding: 10px 18px; border-radius: 12px; text-align: center; }
        .stat-card span { display: block; font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600; }
        .stat-card strong { font-size: 1.2rem; color: var(--accent-green); }
        .actions-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 12px; flex-wrap: wrap; }
        .btn-group { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .btn { border: none; padding: 10px 18px; border-radius: 10px; font-weight: 700; font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: all 0.25s ease; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .btn-add { background: linear-gradient(135deg, #00ff87, #60efff); color: #041308; }
        .btn-search { background: linear-gradient(135deg, #00d2ff, #9d4edd); color: #fff; }
        .btn-clear { background: rgba(247, 37, 133, 0.15); color: #ff4d6d; border: 1px solid rgba(247, 37, 133, 0.3); }
        .api-box { display: flex; align-items: center; gap: 8px; background: rgba(255, 255, 255, 0.03); padding: 6px 12px; border-radius: 10px; border: 1px solid var(--border); }
        input { width: 100%; background: #0b0f19; border: 1px solid var(--border); color: var(--text-main); padding: 7px 8px; border-radius: 8px; font-size: 0.82rem; }
        input:focus { outline: none; border-color: var(--accent-blue); background: #111827; }
        .table-container { background: var(--bg-card); border-radius: 16px; border: 1px solid var(--border); overflow-x: auto; box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
        table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 0.85rem; }
        th, td { padding: 10px 6px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); vertical-align: middle; }
        thead th { padding: 12px; font-size: 0.75rem; text-transform: uppercase; border-bottom: 1px solid var(--border); background: #0f1523; }
        tbody tr:hover { background: var(--bg-hover); }
        .xg-badge { font-weight: 700; color: var(--accent-green); background: rgba(0, 255, 135, 0.08); padding: 6px 8px; border-radius: 6px; display: block; text-align: right; border: 1px solid rgba(0, 255, 135, 0.15); }
        .prob-badge { font-weight: 700; color: var(--accent-blue); }
        .badge-palpite { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 6px 10px; border-radius: 20px; font-size: 0.73rem; font-weight: 700; text-transform: uppercase; width: 100%; }
        .badge-default { background: rgba(148, 163, 184, 0.1); color: var(--text-muted); border: 1px solid var(--border); }
        .badge-over { background: rgba(255, 183, 3, 0.2); color: #ffb703; border: 1px solid rgba(255, 183, 3, 0.4); }
        .badge-casa { background: rgba(0, 255, 135, 0.2); color: var(--accent-green); border: 1px solid rgba(0, 255, 135, 0.4); }
        .badge-fora { background: rgba(157, 78, 221, 0.2); color: #c77dff; border: 1px solid rgba(157, 78, 221, 0.4); }
        .btn-delete { background: transparent; color: #ef4444; border: none; cursor: pointer; font-size: 1.1rem; }
        .text-center { text-align: center; }
        .text-right { text-align: right; }
        .font-bold { font-weight: 700; }
    </style>
</head>
<body>
    <div class="header">
        <div class="title-container">
            <h1>⚽ K.C03M - Analisador Pro</h1>
            <p>Painel de estatísticas e gestão de confrontos esportivos</p>
        </div>
        <div class="stats-summary">
            <div class="stat-card"><span>Total de Jogos</span><strong id="total-jogos">0</strong></div>
            <div class="stat-card"><span>Média xG Gols</span><strong id="media-xg" style="color: var(--accent-blue);">0.00</strong></div>
            <div class="stat-card"><span>Média Escanteios</span><strong id="media-escanteios" style="color: #38bdf8;">0.00</strong></div>
        </div>
    </div>

    <div class="actions-bar">
        <div class="btn-group">
            <button class="btn btn-add" onclick="addRow()">✨ Nova Linha</button>
            <div class="api-box">
                <input type="text" id="search-match-input" placeholder="Ex: Flamengo x Palmeiras" style="width: 250px;">
                <button class="btn btn-search" id="btn-fetch" onclick="buscarEPreencherJogo()">⚡ Buscar Dados</button>
            </div>
        </div>
        <button class="btn btn-clear" onclick="clearAll()">🗑️ Limpar Tudo</button>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th colspan="2" style="color:var(--accent-blue)">Confronto</th>
                    <th colspan="4" style="color:var(--accent-yellow)">Médias de Gols</th>
                    <th colspan="4" style="color:#38bdf8">Médias Escanteios</th>
                    <th colspan="2" style="color:var(--accent-green)">Expectativa (xG)</th>
                    <th colspan="1" style="color:var(--accent-purple)">Odds</th>
                    <th colspan="4" style="color:var(--accent-pink)">Análise Inteligente</th>
                    <th>Ação</th>
                </tr>
            </thead>
            <tbody id="matches-body"></tbody>
        </table>
    </div>

    <!-- Importa o arquivo de lógica separado -->
    <script src="script.js"></script>
</body>
</html>
